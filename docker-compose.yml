services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "${DB_NAME:?Set DB_NAME in .env}"
      MYSQL_USER: "${DB_USER:?Set DB_USER in .env}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >
          mysql --protocol=TCP -h 127.0.0.1
          -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}"
          "$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    build: .
    image: spring-app-compose
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: compose
      DB_NAME: "${DB_NAME:?Set DB_NAME in .env}"
      DB_USER: "${DB_USER:?Set DB_USER in .env}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
